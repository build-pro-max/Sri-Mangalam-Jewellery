<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@1,400&family=Manrope:wght@400;600&family=Noto+Serif+Tamil:wght@400&display=swap" rel="stylesheet" />
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #0B0705; color: #F5EDE1; font-family: Manrope, system-ui, sans-serif; overflow-x:clip; }
  * { box-sizing: border-box; }
  a { color: #E8D3A2; text-decoration: none; }
  a:hover { color: #FFF6DC; }
  img { display: block; max-width: 100%; }
  ::selection { background: rgba(201,162,39,.35); color: #FFF6DC; }
  @keyframes smRise { from { opacity: 0; transform: translate3d(0, 26px, 0); } to { opacity: 1; transform: none; } }
  @keyframes smFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes smSheen { 0% { transform: translateX(-120%); } 60%, 100% { transform: translateX(220%); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
</style>
</helmet>
<div style="position:fixed;inset:0;z-index:900;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%, #241812 0%, #0B0705 72%);opacity:{{ veilOpacity }};transition:opacity 460ms cubic-bezier(.22,.61,.36,1)">
  <div style="position:absolute;inset:0;display:grid;place-items:center;padding:24px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;opacity:{{ veilOpacity }};transform:{{ veilBrandTransform }};transition:opacity 380ms ease,transform 640ms cubic-bezier(.22,.61,.36,1)">
      <span style="position:relative;display:grid;place-items:center;width:56px;height:56px;border:1px solid rgba(233,199,124,.55);background:linear-gradient(150deg,rgba(233,199,124,.22),rgba(11,7,5,.2) 55%,rgba(122,90,42,.3))">
        <span style="position:absolute;inset:4px;border:1px solid rgba(233,199,124,.26)"></span>
        <span style="font-family:Marcellus,serif;font-size:20px;letter-spacing:.04em;background:linear-gradient(120deg,#8A6524,#E4C67F 28%,#FFF6DC 46%,#D9B463 64%,#8A6524);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent">SM</span>
      </span>
      <span style="font-family:'Noto Serif Tamil',serif;font-size:clamp(13px,3.4vw,16px);letter-spacing:.02em;color:rgba(233,199,124,.85);text-align:center">ஸ்ரீ மங்களம் ஜுவல்லரி</span>
      <span style="font-family:Marcellus,serif;font-size:clamp(22px,6vw,34px);letter-spacing:.16em;text-align:center;background:linear-gradient(120deg,#9A7328,#E4C67F 26%,#FFF6DC 44%,#D9B463 62%,#9A7328);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent">SRI MANGALAM</span>
      <span style="width:min(60vw,220px);height:1px;background:linear-gradient(90deg,transparent,#E4C67F,transparent);opacity:.8"></span>
      <span style="font-size:clamp(9px,2.4vw,11px);letter-spacing:.48em;text-transform:uppercase;color:rgba(245,237,225,.6)">Jewellery</span>
    </div>
  </div>
</div>
<header style="position:relative;z-index:800;backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);background:linear-gradient(180deg,rgba(11,7,5,.94) 0%,rgba(20,13,9,.86) 60%,rgba(20,13,9,.64) 100%);border-bottom:1px solid rgba(233,199,124,.16);will-change:transform">
  <div style="background:linear-gradient(90deg,#7C5A1E,#E4C67F 35%,#FFF6DC 50%,#D9B463 66%,#7C5A1E);height:2px;opacity:.85"></div>
  <div style="max-width:1400px;margin:0 auto;padding:{{ barPadding }};display:flex;align-items:center;justify-content:space-between;gap:16px;transition:padding 420ms cubic-bezier(.22,.61,.36,1)">
    <a href="index.html" style="display:flex;align-items:center;gap:clamp(10px,2vw,16px);min-height:44px">
      <span style="position:relative;display:grid;place-items:center;width:clamp(40px,9vw,50px);height:clamp(40px,9vw,50px);flex:none;border:1px solid rgba(233,199,124,.5);background:linear-gradient(150deg,rgba(233,199,124,.20),rgba(11,7,5,.2) 55%,rgba(122,90,42,.28));box-shadow:inset 0 0 14px rgba(233,199,124,.16)">
        <span style="position:absolute;inset:4px;border:1px solid rgba(233,199,124,.24)"></span>
        <span style="font-family:Marcellus,serif;font-size:clamp(16px,3.6vw,19px);letter-spacing:.04em;background:linear-gradient(120deg,#8A6524,#E4C67F 28%,#FFF6DC 46%,#D9B463 64%,#8A6524);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent">SM</span>
      </span>
      <span style="display:flex;flex-direction:column;gap:2px;line-height:1">
        <span style="font-family:'Noto Serif Tamil',serif;font-size:clamp(10px,2.3vw,12px);letter-spacing:.02em;color:rgba(233,199,124,.72)">ஸ்ரீ மங்களம் ஜுவல்லரி</span>
        <span style="font-family:Marcellus,serif;font-size:clamp(17px,4.2vw,23px);letter-spacing:.13em;background:linear-gradient(120deg,#9A7328,#E4C67F 26%,#FFF6DC 44%,#D9B463 62%,#9A7328);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent">SRI MANGALAM</span>
        <span style="font-size:clamp(8.5px,2vw,10px);letter-spacing:.42em;color:rgba(245,237,225,.5);text-transform:uppercase">Jewellery</span>
      </span>
    </a>
    <nav style="display:{{ deskNavDisplay }};align-items:center;gap:clamp(18px,2.6vw,34px)">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="5">
        <a href="{{ item.href }}" style="position:relative;display:inline-flex;align-items:center;min-height:44px;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:{{ item.color }};transition:color 300ms ease" style-hover="color:#FFF6DC">
          {{ item.label }}
          <span style="position:absolute;left:0;right:0;bottom:8px;height:1px;background:linear-gradient(90deg,transparent,#E4C67F,transparent);opacity:{{ item.underline }};transition:opacity 300ms ease"></span>
        </a>
      </sc-for>
      <a href="{{ waLink }}" target="_blank" rel="noopener" style="position:relative;overflow:hidden;display:inline-flex;align-items:center;min-height:44px;padding:12px 22px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#241812;font-weight:600;background:linear-gradient(118deg,#8A6524,#E4C67F 24%,#FFF6DC 44%,#D9B463 66%,#9A7328);box-shadow:0 10px 26px -12px rgba(201,162,39,.7);transition:transform 320ms cubic-bezier(.22,.61,.36,1),box-shadow 320ms ease" style-hover="transform:translateY(-2px);box-shadow:0 16px 34px -12px rgba(201,162,39,.85)" style-active="transform:translateY(0) scale(.985)">
        <span style="position:relative;z-index:2">Enquire</span>
        <span style="position:absolute;top:0;bottom:0;width:38%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:smSheen 4.6s ease-in-out infinite"></span>
      </a>
    </nav>
    <button type="button" onClick="{{ toggle }}" aria-label="Open menu" style="display:{{ burgerDisplay }};flex-direction:column;justify-content:center;gap:5px;width:46px;height:46px;padding:0 11px;background:linear-gradient(150deg,rgba(233,199,124,.14),rgba(11,7,5,.3));border:1px solid rgba(233,199,124,.34);cursor:pointer;transition:border-color 300ms ease" style-hover="border-color:rgba(233,199,124,.7)">
      <span style="height:1px;background:#E8D3A2;transform:{{ burgerTop }};transition:transform 320ms cubic-bezier(.22,.61,.36,1)"></span>
      <span style="height:1px;background:#E8D3A2;opacity:{{ burgerMid }};transition:opacity 220ms ease"></span>
      <span style="height:1px;background:#E8D3A2;transform:{{ burgerBot }};transition:transform 320ms cubic-bezier(.22,.61,.36,1)"></span>
    </button>
  </div>
  <div style="display:{{ drawerDisplay }};overflow:hidden;max-height:{{ drawerHeight }};opacity:{{ drawerOpacity }};transition:max-height 480ms cubic-bezier(.22,.61,.36,1),opacity 380ms ease;border-top:1px solid rgba(233,199,124,.12);background:linear-gradient(180deg,rgba(20,13,9,.96),rgba(11,7,5,.98))">
    <div style="padding:10px clamp(16px,5vw,28px) 22px;display:flex;flex-direction:column">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="5">
        <a href="{{ item.href }}" style="display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 2px;font-family:Marcellus,serif;font-size:17px;letter-spacing:.1em;color:{{ item.color }};border-bottom:1px solid rgba(233,199,124,.1)">
          {{ item.label }}
          <span style="font-size:11px;letter-spacing:.2em;color:rgba(233,199,124,.45)">{{ item.num }}</span>
        </a>
      </sc-for>
      <a href="{{ waLink }}" target="_blank" rel="noopener" style="margin-top:18px;display:flex;align-items:center;justify-content:center;min-height:52px;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#241812;background:linear-gradient(118deg,#8A6524,#E4C67F 24%,#FFF6DC 44%,#D9B463 66%,#9A7328);box-shadow:0 12px 28px -14px rgba(201,162,39,.8)" style-active="transform:scale(.99)">Enquire on WhatsApp</a>
    </div>
  </div>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;About&quot;,&quot;Shop&quot;,&quot;Journal&quot;,&quot;Contact&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, narrow: true, veil: 1, hidden: false, scrolled: false };

  componentDidMount() {
    this.sync = () => this.setState({ narrow: window.innerWidth < 980 });
    this.sync();
    window.addEventListener('resize', this.sync);
    requestAnimationFrame(() => setTimeout(() => this.setState({ veil: 0 }), 40));

    let ticking = false;
    this.onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const y = window.scrollY;
        const next = {};
        next.hidden = false;
        next.scrolled = y >= 48;
        if (next.scrolled !== this.state.scrolled || this.state.hidden) this.setState(next);
        ticking = false;
      });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });

    this.onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      const href = a.getAttribute('href');
      if (!href || a.target === '_blank' || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('http')) return;
      e.preventDefault();
      this.setState({ veil: 1, open: false });
      setTimeout(() => { window.location.href = href; }, 400);
    };
    document.addEventListener('click', this.onClick);
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this.sync);
    window.removeEventListener('scroll', this.onScroll);
    document.removeEventListener('click', this.onClick);
  }

  renderVals() {
    const active = this.props.active || 'Home';
    const pages = [['Home', 'index.html'], ['About', 'about.html'], ['Shop', 'shop.html'], ['Journal', 'journal.html'], ['Contact', 'contact.html']];
    const { narrow, open, hidden, scrolled } = this.state;
    return {
      veilOpacity: this.state.veil,
      veilBrandTransform: this.state.veil ? 'scale(1)' : 'scale(1.05)',
      headerTransform: hidden && !open ? 'translateY(-104%)' : 'translateY(0)',
      barPadding: scrolled ? 'clamp(8px,1.6vw,12px) clamp(16px,4vw,40px)' : 'clamp(12px,2.4vw,18px) clamp(16px,4vw,40px)',
      deskNavDisplay: narrow ? 'none' : 'flex',
      burgerDisplay: narrow ? 'flex' : 'none',
      drawerDisplay: narrow ? 'block' : 'none',
      drawerHeight: open ? '460px' : '0px',
      drawerOpacity: open ? 1 : 0,
      burgerTop: open ? 'translateY(6px) rotate(45deg)' : 'none',
      burgerMid: open ? 0 : 1,
      burgerBot: open ? 'translateY(-6px) rotate(-45deg)' : 'none',
      toggle: () => this.setState(s => ({ open: !s.open })),
      waLink: 'https://wa.me/919677703232?text=' + encodeURIComponent('Hello Sri Mangalam Jewellery, I would like to enquire about your collections.'),
      navItems: pages.map(([label, href], i) => ({
        label, href,
        num: '0' + (i + 1),
        color: label === active ? '#FFF6DC' : 'rgba(245,237,225,.68)',
        underline: label === active ? 1 : 0
      }))
    };
  }
}

</script>
</body>
</html>
